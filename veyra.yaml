# Veyra research pilot settings. Shared and non-secret: versioned in Git.
# Credentials never go here (they live in .env, which Git ignores).
#
# Read by `harvey pilot` (harvey/pilot.py). Changing the budget is a human
# decision; the pilot pauses at it rather than raising it.

sender:                       # placeholders until the GmbH supplies real ones
  name: "[YOUR NAME]"
  company: "[GMBH NAME]"
  domain: "[GMBH-DOMAIN.example]"

# Describe the company, never its size: no headcount, no "small", no "few clients".
offer: >
  A Vienna-based engineering consultancy (Austrian GmbH). Our specialty is
  automating the order-to-invoice work of distributors, wholesalers and
  field-service businesses: quotes, order intake, supplier price lists,
  service calls and documents, and connecting the shop, ERP and accounting
  systems they already run. We prefer proven software over custom builds and
  use AI only where it clearly beats the alternative. Engagements start with
  a short paid discovery, then improvements in stages with ongoing support,
  and no lock-in.

pilot:
  # Sized for one batch a day of ~100 companies (raised from the 25-company
  # test on 2026-10-29 at the user's request): triage 10 calls, up to 10
  # drafts, 1 review, plus retries.
  model_call_budget: 45       # model calls incl. retries, per batch, across resumptions
  max_profiles: 10            # shortlist at most this many; fewer if evidence is weak
  min_fit: 6                  # triage score (0-10) needed to be shortlisted
  triage_chunk: 10            # companies per triage call
  per_query_limit: 300        # OSM results per (term, city); later days go further down the list
  regions:
    US:
      target: 80
      cities_per_batch: 6     # rotate through the list, a few cities a day
      terms: ["wholesale distributor", "hvac", "plumbing", "electrician"]
      cities:                 # US Eastern and Central only
