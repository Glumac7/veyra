<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Veyra Leads</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="login" class="center" hidden>
  <form class="card login" onsubmit="login(event)">
    <h1>Veyra</h1>
    <p class="muted">Shared lead board. Enter the team password.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Open</button>
    <p id="login-err" class="err"></p>
  </form>
</div>

<div id="ask-name" class="center" hidden>
  <form class="card login" onsubmit="saveName(event)">
    <h1>Who are you?</h1>
    <p class="muted">Your first name. It shows next to leads you claim and notes you write.</p>
    <input id="name-input" placeholder="Your name" maxlength="60" required>
    <button type="submit">Continue</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>Veyra <span class="muted">leads</span></h1>
    <div class="who">You: <b id="me"></b> · <a href="#" onclick="changeName(event)">change</a> · <a href="#" onclick="logout(event)">log out</a></div>
  </header>

  <div class="bar">
    <input id="search" type="search" placeholder="Search company, city, what they do…" oninput="render()">
    <select id="f-owner" onchange="render()"></select>
    <select id="f-status" onchange="render()"></select>
    <select id="f-region" onchange="render()"><option value="">All regions</option><option>US</option><option>EU</option></select>
    <a class="btn" href="/api/leads.csv">Download spreadsheet</a>
  </div>
  <div id="summary" class="muted"></div>

  <div class="layout">
    <div class="list"><table><thead><tr><th>Company</th><th>Where</th><th class="num">Fit</th><th>Owner</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <aside id="detail" class="detail"><p class="muted">Pick a lead to see its write-up, draft email and notes.</p></aside>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
